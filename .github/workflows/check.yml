name: Local setup and secret checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install ZIP extraction support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm run verify-data
      - run: npm run check-public
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl -fsSL "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o "$audit_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL "$base/gitleaks_8.30.1_checksums.txt" -o "$audit_dir/checksums.txt"
          (cd "$audit_dir" && sha256sum --check --ignore-missing checksums.txt && tar -xzf gitleaks_8.30.1_linux_x64.tar.gz)
          "$audit_dir/gitleaks" git --log-opts="--all --full-history" --redact --config .gitleaks.toml
